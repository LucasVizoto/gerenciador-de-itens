name: gerenciador-itens-edital

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edital}
      POSTGRES_DB: ${POSTGRES_DB:-edital}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-edital}:${POSTGRES_PASSWORD:-edital}@db:5432/${POSTGRES_DB:-edital}?schema=public
      HOST: 0.0.0.0
      PORT: 3333
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080},http://localhost:4200
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPLOAD_MAX_MB: 5
      # Cria o sistema de demonstração (Gestão de Frotas) quando o banco estiver vazio.
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "${API_PORT:-3333}:3333"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
