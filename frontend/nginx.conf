server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/csv;

  # API Fastify (mesma origem para o navegador: sem CORS).
  location /api/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;

    # Server-Sent Events (tempo real): sem buffer e conexão longa.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location ~* \.(?:js|css|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Rotas do Angular (SPA).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
